
services:
  - type: web
    name: my-capacitor-apk-server
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_EXTRACTED_MB
        value: "80"
      - key: MAX_FILES
        value: "300"
      - key: BUILD_TIMEOUT
        value: "900"
      - key: DATA_DIR
        value: "/tmp/apk-server-data"
